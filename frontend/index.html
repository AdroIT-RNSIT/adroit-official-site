<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="public/ADROIT-logo.webp" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>AdroIT</title>
    <script>
      (function () {
        try {
          var stored = localStorage.getItem("adroit-theme") || localStorage.getItem("adroit-nav-color");
          var dark = stored === "dark" || stored === "black";
          if (dark) document.documentElement.classList.add("dark");
          document.documentElement.style.backgroundColor = dark ? "#080c16" : "#f3e8ff";
        } catch (e) {}
      })();
    </script>
    <style>
      html, body { background-color: #f3e8ff; color: #0f172a; }
      html.dark, html.dark body { background-color: #080c16; color: #e2e8f0; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
