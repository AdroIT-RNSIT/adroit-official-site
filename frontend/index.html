<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="public/ADROIT-logo.webp" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>AdroIT</title>
    <!-- Space Grotesk: premium display font for tech aesthetic -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&family=Space+Mono:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet" />
    <script>
      (function () {
        try {
          var stored = localStorage.getItem("adroit-theme") || localStorage.getItem("adroit-nav-color");
          var dark = stored === "dark" || stored === "black";
          if (dark) document.documentElement.classList.add("dark");
          document.documentElement.style.backgroundColor = dark ? "#060b18" : "#ffffff";
        } catch (e) {}
      })();
    </script>
    <style>
      html, body { background-color: #ffffff; color: #0f172a; }
      html.dark, html.dark body { background-color: #060b18; color: #e2e8f0; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
