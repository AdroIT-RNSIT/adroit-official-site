    <script>
      (function () {
        try {
          var stored = localStorage.getItem("adroit-theme") || localStorage.getItem("adroit-nav-color");
          var dark = stored === "dark" || stored === "black";
          if (dark) document.documentElement.classList.add("dark");
          document.documentElement.style.backgroundColor = dark ? "#000000" : "#f3e8ff";
        } catch (e) {}
      })();
    </script>
    <style>
      html, body { background-color: #f3e8ff; color: #0f172a; }
      html.dark, html.dark body { background-color: #000000; color: #e2e8f0; }
